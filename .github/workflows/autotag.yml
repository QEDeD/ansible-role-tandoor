---
name: Autotag releases

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # required to push tags

jobs:
  autotag:
    name: Autotag
    runs-on: ubuntu-latest

    # Releases are cut in the repository this role is published from, and there
    # only. A fork sees its own, incomplete set of tags, so it would compute a
    # release number that is already taken upstream and attach it to different
    # code. The `mother-of-all-self-hosting` fork, through which contributions
    # to this role are staged, is exactly that case: it is missing the
    # v2.6.13-0 and v2.6.13-1 tags that upstream carries.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}

    # Serialize tag computation and publication. Pending runs may be replaced
    # or arrive out of commit order, so each run checks the latest main rather
    # than its triggering commit. Intermediate commits may share one release.
    concurrency:
      group: autotag
      cancel-in-progress: false

    steps:
      # The full history and all tags, since we compare against the previous release.
      - name: Check out
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Determine the next tag
        id: tag
        run: |
          tag="$(bin/compute-next-tag.sh)"
          if [ -z "$tag" ]; then
            echo 'No release is needed for this commit'
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
