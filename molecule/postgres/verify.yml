---
- name: Verify Tandoor
  hosts: all
  become: true
  gather_facts: false

  vars:
    tandoor_verify_base_path: "/{{ tandoor_identifier }}"
    tandoor_verify_url: "http://{{ tandoor_hostname }}:{{ tandoor_container_http_host_bind_port }}"
    tandoor_verify_unexpected_host_url: "http://{{ tandoor_molecule_unexpected_hostname }}:{{ tandoor_container_http_host_bind_port }}"

    # Where Tandoor's settings would put a SQLite file if `DB_ENGINE` did not
    # name the Postgres backend.
    tandoor_verify_sqlite_path: /opt/recipes/db.sqlite3

    # The query goes in as the role's own database user rather than as the
    # Postgres superuser, so `tandoor_database_username`, `_password` and
    # `_name` are all under test here too.
    tandoor_verify_psql:
      - docker
      - exec
      - "--env=PGPASSWORD={{ tandoor_database_password }}"
      - "{{ postgres_identifier | default('postgres') }}"
      - psql
      - "--username={{ tandoor_database_username }}"
      - "--dbname={{ tandoor_database_name }}"
      - --tuples-only
      - --no-align

    tandoor_verify_migration_count_sql: "SELECT count(*) FROM django_migrations"
    tandoor_verify_latest_migration_sql: >-
      SELECT app || '.' || name FROM django_migrations ORDER BY id DESC LIMIT 1

    tandoor_verify_python:
      - docker
      - exec
      - "{{ tandoor_identifier }}"
      - /opt/recipes/venv/bin/python
      - -c

  tasks:
    - name: Run the checks shared by all Tandoor scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/tasks/verify_tandoor.yml"

    # Pointing `tandoor_database_type` at `postgres` is only worth testing if it
    # actually moves the data. Asking Postgres itself which migrations Django
    # recorded there is what settles that: a `DB_ENGINE` that never reached the
    # process would leave every check above looking exactly as convincing, while
    # Tandoor quietly kept a SQLite file of its own.
    - name: Count the migrations Tandoor applied to the Postgres database
      ansible.builtin.command:
        argv: "{{ tandoor_verify_psql + ['--command=' ~ tandoor_verify_migration_count_sql] }}"
      register: tandoor_postgres_migrations
      changed_when: false
      failed_when: false

    - name: Read the last migration Tandoor applied to the Postgres database
      ansible.builtin.command:
        argv: "{{ tandoor_verify_psql + ['--command=' ~ tandoor_verify_latest_migration_sql] }}"
      register: tandoor_postgres_latest_migration
      changed_when: false
      failed_when: false

    - name: Assert that Tandoor migrated the Postgres database the role configured
      ansible.builtin.assert:
        that:
          - tandoor_postgres_migrations.rc == 0
          - tandoor_postgres_migrations.stdout | trim | int > 100
          - tandoor_postgres_latest_migration.stdout | trim is match('^cookbook[.]')
        fail_msg: >-
          Querying the `{{ tandoor_database_name }}` database as
          `{{ tandoor_database_username }}` gave
          rc={{ tandoor_postgres_migrations.rc }},
          stdout={{ tandoor_postgres_migrations.stdout | default('') | trim }},
          stderr={{ tandoor_postgres_migrations.stderr | default('') | trim }}
        success_msg: >-
          The `{{ tandoor_database_name }}` Postgres database holds
          {{ tandoor_postgres_migrations.stdout | trim }} applied migrations, the last of
          them {{ tandoor_postgres_latest_migration.stdout | trim }}

    - name: Check whether Tandoor also wrote a SQLite database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ tandoor_identifier }}"
          - sh
          - -c
          - "test -e '{{ tandoor_verify_sqlite_path }}' && echo present || echo absent"
      register: tandoor_sqlite_file
      changed_when: false

    # The counterpart of the check above. Tandoor's settings fall back to SQLite
    # whenever `DB_ENGINE` does not reach the process, and it would then have a
    # database of its own that worked - every shared check would still pass, and
    # the rows would simply not be in the database Postgres was asked for.
    - name: Assert that Tandoor did not fall back to SQLite
      ansible.builtin.assert:
        that: tandoor_sqlite_file.stdout | trim == 'absent'
        fail_msg: >-
          Tandoor wrote a SQLite database at `{{ tandoor_verify_sqlite_path }}`
          despite being pointed at Postgres
        success_msg: "Tandoor wrote no SQLite database, so Postgres is its only store"

    # This scenario runs with `tandoor_container_labels_traefik_enabled: false`.
    # Every Traefik label the role emits has to be inside that conditional -
    # a label leaking out of it would attach a route to a container the operator
    # asked not to be routed to.
    - name: Assert that no Traefik label was written
      ansible.builtin.assert:
        that: tandoor_labels_lines | select('match', '^traefik[.]') | list | length == 0
        fail_msg: >-
          The label file holds Traefik labels
          ({{ tandoor_labels_lines | select('match', '^traefik[.]') | list }})
          even though `tandoor_container_labels_traefik_enabled` is false
        success_msg: "No Traefik label was written while Traefik labels are turned off"

    # Fresh migrations do not prove that application data survives replacement.
    # Write through Django's own connection and media path, then read through
    # the replacement container without recreating either sentinel.
    - name: Record the Tandoor container before replacement
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{.Id}}' }}", "{{ tandoor_identifier }}"]
      register: tandoor_container_before
      changed_when: false

    - name: Write database and media sentinels through Tandoor
      ansible.builtin.command:
        argv: "{{ tandoor_verify_python + [tandoor_persistence_seed_script] }}"
      vars:
        tandoor_persistence_seed_script: |
          import os
          import uuid
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "recipes.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          assert connection.vendor == "postgresql", "Tandoor is not using PostgreSQL"
          token = str(uuid.uuid4())
          with connection.cursor() as cursor:
              cursor.execute("CREATE TABLE IF NOT EXISTS molecule_tandoor_persistence (id integer PRIMARY KEY, token text NOT NULL)")
              cursor.execute("INSERT INTO molecule_tandoor_persistence VALUES (1, %s) ON CONFLICT (id) DO UPDATE SET token = EXCLUDED.token", [token])
          (Path(settings.MEDIA_ROOT) / "molecule-persistence-sentinel").write_text(token)
          print(token)
      register: tandoor_persistence_seed
      changed_when: true

    - name: Replace the Tandoor container through its systemd service
      ansible.builtin.systemd_service:
        name: "{{ tandoor_identifier }}.service"
        state: restarted

    - name: Wait for the replacement Tandoor to answer
      ansible.builtin.uri:
        url: "{{ tandoor_verify_url }}/"
        follow_redirects: none
        status_code: [302]
      register: tandoor_replacement_response
      until: >-
        tandoor_replacement_response.status | default(0) == 302
        and tandoor_replacement_response.location | default('') in ['/setup/', tandoor_verify_url ~ '/setup/']
      retries: 60
      delay: 5

    - name: Record the replacement Tandoor container
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{.Id}}' }}", "{{ tandoor_identifier }}"]
      register: tandoor_container_after
      changed_when: false

    - name: Assert that the service replaced the application container
      ansible.builtin.assert:
        that: tandoor_container_before.stdout | trim != tandoor_container_after.stdout | trim
        fail_msg: "The persistence check requires a replacement container, but its ID did not change"

    - name: Verify that the replacement Tandoor can read the original data
      ansible.builtin.command:
        argv: "{{ tandoor_verify_python + [tandoor_persistence_verify_script, tandoor_persistence_seed.stdout_lines | last] }}"
      vars:
        tandoor_persistence_verify_script: |
          import os
          import sys
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "recipes.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.db import connection
          assert connection.vendor == "postgresql", "Replacement Tandoor is not using PostgreSQL"
          with connection.cursor() as cursor:
              cursor.execute("SELECT token FROM molecule_tandoor_persistence WHERE id = 1")
              assert cursor.fetchone() == (sys.argv[1],), "Database sentinel did not survive container replacement"
          assert (Path(settings.MEDIA_ROOT) / "molecule-persistence-sentinel").read_text() == sys.argv[1], "Media sentinel did not survive container replacement"
      changed_when: false

    - name: Show the verification summary
      ansible.builtin.debug:
        msg:
          - "version: {{ tandoor_reported_version }}"
          - "listening on: {{ tandoor_verify_url }} (container port {{ tandoor_container_http_port }})"
          - "postgres ({{ tandoor_database_name }}): {{ tandoor_postgres_migrations.stdout | trim }} migrations"
          - "sqlite at {{ tandoor_verify_sqlite_path }}: {{ tandoor_sqlite_file.stdout | trim }}"
